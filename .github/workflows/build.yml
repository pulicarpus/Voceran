name: Build vArranger Controller APK

# Memicu build secara MANUAL dari tab Actions di GitHub
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK (Wajib untuk kompilasi Android)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup SDK Flutter versi stabil terbaru
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Hapus struktur android usang (v1) & buat ulang struktur v2 modern
      - name: Rebuild Clean Android Directory (v2 Embedding)
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=varranger_controller
          
          # Sisipkan Izin MIDI & Bluetooth otomatis ke AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='    <uses-feature android:name="android.software.midi" android:required="true"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'
          sed -i "/<manifest/a $PERMISSIONS" $MANIFEST

      # 5. Download pustaka MIDI dan Build APK Release
      - name: Build APK Release
        run: |
          flutter pub get
          flutter build apk --release

      # 6. Upload file APK hasil build ke GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: varranger-controller-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 7. Kirim file APK otomatis ke Telegram
      - name: Kirim APK ke Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: build/app/outputs/flutter-apk/app-release.apk
          message: |
            🚀 *Build Sukses, Bos!*
            Aplikasi vArranger2 Controller (Modern v2 Embedding) sudah matang terakit sempurna. Silakan diunduh!