name: Build Flutter APK Minimalist

# Memicu build secara MANUAL saja dari tab Actions di GitHub
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori GitHub bos
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK (Wajib untuk kompilasi Android)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup SDK Flutter versi stabil terbaru
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Membuat base project dan menyalin file kustom dari HP bos
      - name: Assemble Flutter Project Structure
        run: |
          flutter create voceran_app
          cp -r lib voceran_app/
          cp pubspec.yaml voceran_app/
          cp -r android voceran_app/

      # 5. Mengunduh package/library dan build ke APK Release
      - name: Build APK Release
        run: |
          cd voceran_app
          flutter pub get
          flutter build apk --release

      # 6. Upload file APK hasil build agar bisa bos download di browser
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voceran-v6-pro-apk
          path: voceran_app/build/app/outputs/flutter-apk/app-release.apk
          
      # 7. Jalur Tikus Kilat Menggunakan Transfer.sh (Lebih Stabil & Kebal DNS Error)
      - name: Kirim ke Link Download Cepat
        run: |
          echo "--------------------------------------------------"
          echo "KLIK LINK DI BAWAH INI UNTUK DOWNLOAD NGEBUT, BOS:"
          curl --upload-file voceran_app/build/app/outputs/flutter-apk/app-release.apk https://transfer.sh/app-release.apk
          echo ""
          echo "--------------------------------------------------"